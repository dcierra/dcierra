    <circle cx="60" cy="24" r="5" fill="#4ade80"/>

    <g font-family="Consolas, 'Courier New', monospace" font-size="14.5">
      <text x="20" y="68"><tspan fill="#c084fc">from </tspan><tspan fill="#7dd3fc">fastapi </tspan><tspan fill="#c084fc">import </tspan><tspan fill="#86efac">FastAPI</tspan></text>
      <text x="20" y="106"><tspan fill="#e2e8f0">app = </tspan><tspan fill="#86efac">FastAPI</tspan><tspan fill="#e2e8f0">()</tspan></text>
      <text x="20" y="144"><tspan fill="#7dd3fc">@app.get</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#f9a8d4">"/health"</tspan><tspan fill="#e2e8f0">)</tspan></text>
      <text x="20" y="180"><tspan fill="#c084fc">async def </tspan><tspan fill="#7dd3fc">health</tspan><tspan fill="#e2e8f0">():</tspan></text>
      <text x="38" y="216"><tspan fill="#c084fc">return </tspan><tspan fill="#e2e8f0">{</tspan><tspan fill="#f9a8d4">"status"</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#f9a8d4">"ok"</tspan><tspan fill="#e2e8f0">}</tspan></text>
