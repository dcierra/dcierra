<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Sergey Borisov, Python Developer</title>
  <desc id="desc">Backend systems, API integrations and data processing</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#background)"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>

  <circle cx="1120" cy="30" r="260" fill="url(#purpleGlow)"/>
  <circle cx="770" cy="340" r="300" fill="url(#blueGlow)"/>

  <g transform="translate(68 62)">
    <rect x="0" y="0" width="74" height="6" rx="3" fill="url(#accent)"/>

    <text x="0" y="58" fill="#f8fafc" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="1.5">
      SERGEY BORISOV
    </text>

    <text x="0" y="102" fill="#7dd3fc" font-family="'Segoe UI', Arial, sans-serif" font-size="27" font-weight="600">
      Python Developer
    </text>

    <text x="0" y="146" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="20">
      Backend Systems  •  API Integrations  •  Data Processing
    </text>

    <g transform="translate(0 178)" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600">
      <g>
        <rect width="82" height="34" rx="17" fill="#38bdf8" fill-opacity="0.13" stroke="#38bdf8" stroke-opacity="0.55"/>
        <text x="41" y="22" text-anchor="middle" fill="#bae6fd">FastAPI</text>
      </g>
      <g transform="translate(94 0)">
        <rect width="112" height="34" rx="17" fill="#818cf8" fill-opacity="0.13" stroke="#818cf8" stroke-opacity="0.55"/>
        <text x="56" y="22" text-anchor="middle" fill="#c7d2fe">PostgreSQL</text>
      </g>
      <g transform="translate(218 0)">
        <rect width="84" height="34" rx="17" fill="#c084fc" fill-opacity="0.13" stroke="#c084fc" stroke-opacity="0.55"/>
        <text x="42" y="22" text-anchor="middle" fill="#e9d5ff">asyncio</text>
      </g>
    </g>
  </g>

  <g transform="translate(880 55)" filter="url(#shadow)">
    <rect width="250" height="210" rx="20" fill="#0f172a" fill-opacity="0.82" stroke="#64748b" stroke-opacity="0.28"/>

    <circle cx="24" cy="24" r="5" fill="#fb7185"/>
    <circle cx="42" cy="24" r="5" fill="#fbbf24"/>
    <circle cx="60" cy="24" r="5" fill="#4ade80"/>

    <text x="24" y="76" fill="#c084fc" font-family="Consolas, 'Courier New', monospace" font-size="18">async def</text>
    <text x="123" y="76" fill="#7dd3fc" font-family="Consolas, 'Courier New', monospace" font-size="18">build</text>
    <text x="173" y="76" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" font-size="18">():</text>

    <text x="42" y="112" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="17">api =</text>
    <text x="104" y="112" fill="#86efac" font-family="Consolas, 'Courier New', monospace" font-size="17">FastAPI()</text>

    <text x="42" y="148" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="17">data =</text>
    <text x="112" y="148" fill="#f9a8d4" font-family="Consolas, 'Courier New', monospace" font-size="17">await</text>

    <text x="42" y="182" fill="#7dd3fc" font-family="Consolas, 'Courier New', monospace" font-size="17">integrate()</text>
  </g>

  <rect x="0" y="314" width="1200" height="6" rx="3" fill="url(#accent)"/>
</svg>
